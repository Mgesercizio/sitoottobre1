                <h1 class="titolo">Scomposizione Della Velocità</h1>
                <p class="formula">v₀x = v₀ · cos(θ)</p>
                <p class="formula">v₀y = v₀ · sin(θ)</p>
                Derivano dalla trigonometria del triangolo rettangolo:
                <ul>
                    <li>cos(θ) = cateto adiacente / ipotenusa</li>
                    <li>sin(θ) = cateto opposto / ipotenusa</li>
                </ul>
            </div>
        </div>
